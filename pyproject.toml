[project]
name = "nnCPUnet"
version = "0.1.3"
requires-python = ">=3.10"
description = "nnCPUnet — controlled nnU-Net v2 fork for CPU / federated workflows (FedV1)."
readme = "readme.md"
license = { file = "LICENSE" }
authors = [
    { name = "Fabian Isensee", email = "f.isensee@dkfz-heidelberg.de" },
    { name = "Helmholtz Imaging Applied Computer Vision Lab" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
    "deep learning",
    "image segmentation",
    "semantic segmentation",
    "medical image analysis",
    "medical image segmentation",
    "nnU-Net",
    "nnCPUnet",
    "nncpunet",
]
dependencies = [
    "torch>=2.1.2,!=2.9.*",
    "acvl-utils>=0.2.6,<0.3",
    "dynamic-network-architectures>=0.4.4,<0.5",
    "tqdm",
    "scipy",
    "batchgenerators>=0.25.1",
    "numpy>=1.24",
    "scikit-learn",
    "scikit-image>=0.19.3",
    "SimpleITK>=2.2.1",
    "pandas",
    "graphviz",
    "tifffile",
    "requests",
    "nibabel",
    "matplotlib",
    "seaborn",
    "imagecodecs",
    "yacs",
    "batchgeneratorsv2>=0.3.2",
    "einops",
    "blosc2>=3.3.2",
    "timm>=1.0",
]

[project.urls]
homepage = "https://github.com/Williamwhy/nnCPUNet"
repository = "https://github.com/Williamwhy/nnCPUNet"

[project.scripts]
nnCPUnet_plan_and_preprocess = "nncpunet.experiment_planning.plan_and_preprocess_entrypoints:plan_and_preprocess_entry"
nnCPUnet_extract_fingerprint = "nncpunet.experiment_planning.plan_and_preprocess_entrypoints:extract_fingerprint_entry"
nnCPUnet_plan_experiment = "nncpunet.experiment_planning.plan_and_preprocess_entrypoints:plan_experiment_entry"
nnCPUnet_preprocess = "nncpunet.experiment_planning.plan_and_preprocess_entrypoints:preprocess_entry"
nnCPUnet_train = "nncpunet.run.run_training:run_training_entry"
nnCPUnet_predict_from_modelfolder = "nncpunet.inference.predict_from_raw_data:predict_entry_point_modelfolder"
nnCPUnet_predict = "nncpunet.inference.predict_from_raw_data:predict_entry_point"
nnCPUnet_convert_old_nnUNet_dataset = "nncpunet.dataset_conversion.convert_raw_dataset_from_old_nnunet_format:convert_entry_point"
nnCPUnet_find_best_configuration = "nncpunet.evaluation.find_best_configuration:find_best_configuration_entry_point"
nnCPUnet_determine_postprocessing = "nncpunet.postprocessing.remove_connected_components:entry_point_determine_postprocessing_folder"
nnCPUnet_apply_postprocessing = "nncpunet.postprocessing.remove_connected_components:entry_point_apply_postprocessing"
nnCPUnet_ensemble = "nncpunet.ensembling.ensemble:entry_point_ensemble_folders"
nnCPUnet_accumulate_crossval_results = "nncpunet.evaluation.find_best_configuration:accumulate_crossval_results_entry_point"
nnCPUnet_plot_overlay_pngs = "nncpunet.utilities.overlay_plots:entry_point_generate_overlay"
nnCPUnet_download_pretrained_model_by_url = "nncpunet.model_sharing.entry_points:download_by_url"
nnCPUnet_install_pretrained_model_from_zip = "nncpunet.model_sharing.entry_points:install_from_zip_entry_point"
nnCPUnet_export_model_to_zip = "nncpunet.model_sharing.entry_points:export_pretrained_model_entry"
nnCPUnet_move_plans_between_datasets = "nncpunet.experiment_planning.plans_for_pretraining.move_plans_between_datasets:entry_point_move_plans_between_datasets"
nnCPUnet_evaluate_folder = "nncpunet.evaluation.evaluate_predictions:evaluate_folder_entry_point"
nnCPUnet_evaluate_simple = "nncpunet.evaluation.evaluate_predictions:evaluate_simple_entry_point"
nnCPUnet_convert_MSD_dataset = "nncpunet.dataset_conversion.convert_MSD_dataset:entry_point"
nnCPUnet_preprocess_like_nnssl = "nncpunet.experiment_planning.like_nnssl:preprocess_like_nnssl_entrypoint"
nnCPUnet_plan_like_dynamic = "nncpunet.experiment_planning.like_nnssl:plan_like_dynamic_entrypoint"
nnCPUnet_train_pretrained = "nncpunet.run.run_training_from_pretrained:train_pretrained_entrypoint"

[project.optional-dependencies]
dev = [
    "pre-commit",
]
intel_macos = [
    "torch<2.3 ; platform_system == 'Darwin'",
    "numpy<2 ; platform_system == 'Darwin'",
]

[tool.setuptools.packages.find]
include = ["nncpunet*"]

[build-system]
requires = ["setuptools>=67.8.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W"]
ignore = ["F403", "F405", "E501", "E741", "E722"]

[tool.codespell]
skip = ".git,*.pdf,*.svg"
ignore-words-list = "LiTS,assertIn"